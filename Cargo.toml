[package]
name = "lightwell"
version = "0.1.0"
edition = "2024"

[dependencies]
block2 = "=0.6.2"
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow"] }
objc2 = "=0.6.4"
objc2-app-kit = "=0.3.2"
objc2-foundation = { version = "=0.3.2", features = ["objc2-core-services"] }
objc2-service-management = "=0.3.2"
raw-window-handle = "=0.6.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=1.1.6"
winit = { version = "=0.30.13", default-features = false }

[profile.release]
lto = true
codegen-units = 1
