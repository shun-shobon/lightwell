[package]
name = "lightwell"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
base64 = "=0.22.1"
block2 = "=0.6.2"
dioxus = { version = "=0.7.10", default-features = false, features = ["desktop", "document", "hooks", "html", "macro", "signals"] }
futures-channel = "=0.3.34"
futures-util = { version = "=0.3.34", default-features = false }
objc2 = "=0.6.4"
objc2-app-kit = "=0.3.2"
objc2-foundation = { version = "=0.3.2", features = ["objc2-core-services"] }
objc2-service-management = "=0.3.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=1.1.6"

[profile.release]
lto = true
codegen-units = 1
